version = 1

# Original Markdown and human-readable textual material: README, AGENTS.md,
# root licensing policy docs, docs/assets, and the three product skills'
# SKILL.md / LICENSING.md / references / assets.
[[annotations]]
path = [
  "README.md",
  "AGENTS.md",
  "LICENSING.md",
  "THIRD_PARTY_NOTICES.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "docs/**",
  ".agents/skills/*/SKILL.md",
  ".agents/skills/*/LICENSING.md",
  ".agents/skills/*/THIRD_PARTY_NOTICES.md",
  ".agents/skills/*/references/**",
  ".agents/skills/*/assets/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Romain Monier <https://github.com/rmonier>"
SPDX-License-Identifier = "CC-BY-4.0"

# Original executable code: the Python scripts bundled with the three
# product skills. Each file also carries a direct SPDX header comment;
# this bucket is a safety net for any script that is missing one.
[[annotations]]
path = [
  ".agents/skills/*/scripts/**/*.py",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Romain Monier <https://github.com/rmonier>"
SPDX-License-Identifier = "Apache-2.0"

# Repository and per-skill operational metadata/configuration, including the
# skills' functional template assets (copy-into-repo configuration, not
# prose). Listed after the assets/** content block so it wins for these files.
[[annotations]]
path = [
  "NOTICE",
  "CITATION.cff",
  ".gitignore",
  ".gitattributes",
  ".agents/skills/*/NOTICE",
  ".agents/skills/agent-ready-context/assets/okf-validate.ci.yml",
  ".agents/skills/agent-ready-context/assets/gitattributes.template",
  ".agents/skills/skill-creator/assets/skill-lock.example.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Romain Monier <https://github.com/rmonier>"
SPDX-License-Identifier = "Apache-2.0"

# okf/wiki/ is internal project context (the OpenWiki-maintained OKF wiki),
# not part of the licensed product surface. See LICENSING.md for why this is
# deliberately unlicensed rather than CC-BY-4.0.
[[annotations]]
path = [
  "okf/wiki/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Romain Monier <https://github.com/rmonier>"
SPDX-License-Identifier = "LicenseRef-All-Rights-Reserved"

# okf/wiki/INSTRUCTIONS.md is a byte copy of the CC-BY-4.0 template shipped
# with agent-ready-context; the copy keeps the original's open licence.
# Listed after the okf/wiki/** block so it wins for this one file.
[[annotations]]
path = [
  "okf/wiki/INSTRUCTIONS.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Romain Monier <https://github.com/rmonier>"
SPDX-License-Identifier = "CC-BY-4.0"
